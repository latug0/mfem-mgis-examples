name: Spack And Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# a new commit pushed to a pull request cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # filled by the continuous integration of mfem-mgis, only read here
      BUILD_CACHE: oci://ghcr.io/thelfer/mfem-mgis-spack-buildcache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: v1.2.2      # Spack version
          packages_ref: develop  # the builtin repository provides mfem-mgis since its develop version
          buildcache: false      # the public build cache would bring older dependencies
          color: true            # Force color output (SPACK_COLOR=always)
          spack_path: spack      # Where to clone Spack
      # the configuration of mfem-mgis, as its binaries are only reused when their hash matches
      - name: Set up the build cache
        uses: thelfer/mfem-mgis/.github/actions/setup-build-cache@master
      - name: Install MFEM MGIS
        run: |
          # pin the master commits, as mfem-mgis does when it fills its build cache
          tfel=$(git ls-remote https://github.com/thelfer/tfel.git refs/heads/master | cut -f1)
          mgis=$(git ls-remote https://github.com/thelfer/MFrontGenericInterfaceSupport.git refs/heads/master | cut -f1)
          spack install mfem-mgis@master ^tfel@master commit=$tfel ^mgis@master commit=$mgis
      - name: Build the examples
        shell: spack-sh {0}
        run: |
          spack load mfem-mgis
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)
      - name: Run the examples
        shell: spack-sh {0}
        run: |
          spack load mfem-mgis
          ctest --test-dir build -j $(nproc) --output-on-failure
